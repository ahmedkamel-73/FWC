<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FWC Admin Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0c0f; --surface: #161a20; --surface-2: #1c212a; --surface-3: #232a36;
    --border: #232a36; --text: #e6e9ee; --text-muted: #7a8599; --text-dim: #4b556a;
    --accent: #c8ff3c; --accent-2: #7affc6; --danger: #ff4d4d; --warn: #ffb020;
    --font: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; font-size: 13px; }
  
  #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg); padding: 20px; }
  .login-box { background: var(--surface); border: 1px solid var(--border); padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 360px; text-align: center; }
  .login-box h2 { font-size: 18px; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; margin-bottom: 12px; }
  .login-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #000; font-weight: 800; cursor: pointer; font-family: inherit; }
  
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 260px; background: rgba(17,20,24,0.95); border-right: 1px solid var(--border); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
  @media (max-width: 768px) { .sidebar { display: none; } }
  .logo { display: flex; align-items: center; gap: 10px; padding: 8px 12px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  .logo-title { font-weight: 800; font-size: 14px; }
  .logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; }
  .nav-btn { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text-muted); display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; cursor: pointer; margin-bottom: 4px; text-align: left; font-family: inherit; transition: all 0.15s; }
  .nav-btn.active { background: var(--surface-2); border-color: var(--surface-3); color: #fff; }
  .nav-btn:hover { background: var(--surface); color: #fff; }
  .nav-btn .badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 999px; font-weight: 800; }
  .main { flex: 1; padding: 16px; max-width: 100%; overflow-x: hidden; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 16px; background: var(--surface); border-radius: 12px; border: 1px solid var(--border); }
  .header h1 { font-size: 16px; font-weight: 800; }
  .header-info { font-size: 11px; color: var(--text-muted); }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-size: 24px; font-weight: 800; }
  .stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .section-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 8px 14px; border-radius: 10px; border: none; background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: var(--surface-3); }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent-2); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 11px; }
  .table-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 10px 8px; text-align: left; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--border); font-weight: 600; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--surface-2); }
  .badge-status { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
  .badge-active { background: rgba(122,255,198,0.15); color: var(--accent-2); }
  .badge-banned { background: rgba(255,77,77,0.15); color: #ff6b6b; }
  .badge-pending { background: rgba(255,176,32,0.15); color: var(--warn); }
  .badge-approved { background: rgba(122,255,198,0.15); color: var(--accent-2); }
  .badge-rejected { background: rgba(255,77,77,0.15); color: #ff6b6b; }
  .badge-processing { background: rgba(109,124,255,0.15); color: #8B9AFF; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
  .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 12px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
  .tabs-mobile { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; }
  .tabs-mobile::-webkit-scrollbar { display: none; }
  @media (min-width: 769px) { .tabs-mobile { display: none; } }
  .mob-tab { padding: 8px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 11px; white-space: nowrap; cursor: pointer; font-family: inherit; color: var(--text-muted); }
  .mob-tab.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 1000; box-shadow: 0 8px 30px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.success { background: var(--accent-2); color: #000; border-color: var(--accent-2); }
  .toast.error { background: var(--danger); color: #fff; border-color: var(--danger); }
  .hidden { display: none !important; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 30px; color: var(--text-muted); font-size: 12px; }
  .search-input { width: 100%; max-width: 300px; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 12px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h3 { font-size: 16px; font-weight: 800; }
  .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
  .modal-footer { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <h2>🔐 Admin Login</h2>
    <input type="password" id="admin-pass" placeholder="Enter Password" onkeypress="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">Login</button>
    <div id="login-error" style="color:var(--danger); font-size:12px; margin-top:10px;"></div>
  </div>
</div>

<!-- Admin Panel -->
<div class="app hidden" id="admin-app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">F</div>
      <div>
        <div class="logo-title">FWC ADMIN</div>
        <div class="logo-sub">CONTROL PANEL</div>
      </div>
    </div>
    <nav id="sidebarNav"></nav>
  </aside>

  <main class="main">
    <div class="tabs-mobile" id="mobTabs"></div>
    <div class="header">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="header-info" id="pageSub">System overview</div>
      </div>
      <button class="btn btn-sm" onclick="refreshPage()">🔄 Refresh</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Task Modal -->
<div id="task-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="task-modal-title">Add New Task</h3>
      <button class="modal-close" onclick="closeTaskModal()">&times;</button>
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label>Task ID (Unique)</label>
      <input type="text" id="task-id" placeholder="e.g. join_channel, watch_ad">
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label>Title (English)</label>
      <input type="text" id="task-title" placeholder="Task title">
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label>Title (Arabic) - Optional</label>
      <input type="text" id="task-title-ar" placeholder="عنوان المهمة">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Type</label>
        <select id="task-type" onchange="toggleChannelField()">
          <option value="join">Join Channel</option>
          <option value="youtube">YouTube</option>
          <option value="x">X (Twitter)</option>
          <option value="ads">Watch Ad</option>
          <option value="invite">Invite Friend</option>
          <option value="custom">Custom Link</option>
        </select>
      </div>
      <div class="form-group">
        <label>Reward (FWC)</label>
        <input type="number" id="task-reward" placeholder="5">
      </div>
    </div>

    <!-- URL Field -->
    <div class="form-group" style="margin-bottom:12px;" id="url-field">
      <label>URL (Link)</label>
      <input type="text" id="task-url" placeholder="https://t.me/...">
    </div>

    <!-- Channel Field -->
    <div class="form-group" style="margin-bottom:12px;" id="channel-field">
      <label>Channel Username (for join tasks)</label>
      <input type="text" id="task-channel" placeholder="@channel_username">
    </div>

    <!-- Ads Info Field (Only for ads) -->
    <div class="form-group" style="margin-bottom:12px;" id="ads-info-field">
      <label>Ads Block ID</label>
      <input type="text" id="task-ads-info" value="From Ads Settings" disabled>
      <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">Ads tasks use the Reward Ads Block ID from the Ads settings page. No URL needed.</div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Max per Day</label>
        <input type="number" id="task-max" value="1">
      </div>
      <div class="form-group">
        <label>Once (Only once?)</label>
        <select id="task-once">
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeTaskModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTaskData()">💾 Save Task</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let ADMIN_SECRET = '';
let EDITING_TASK_ID = null;

const STATE = {
  tab: 'dashboard',
  stats: { usersCount: 0, wdPending: 0, miningAmount: 0, totalBalance: 0, totalMined: 0, totalFees: 0, openAlerts: 0 },
  users: [],
  tasks: [],
  withdrawals: [],
  economy: {},
  feeConfig: { enabled: true, percent: 5 },
  alerts: [],
  payoutStats: null,
  loading: false,
};

const NAV = [
  { id: 'dashboard', icon: '📊', label: 'Dashboard', title: 'Dashboard', sub: 'System overview' },
  { id: 'users', icon: '👥', label: 'Users', title: 'Users', sub: 'Manage accounts & bans' },
  { id: 'mining', icon: '⛏️', label: 'Mining', title: 'Mining Settings', sub: 'Rewards & intervals' },
  { id: 'tasks', icon: '📋', label: 'Tasks', title: 'Daily Tasks', sub: 'Add/edit/delete' },
  { id: 'withdrawals', icon: '💸', label: 'Withdrawals', title: 'Withdrawals', sub: 'Approve or reject' },
  { id: 'fees', icon: '💰', label: 'Fees', title: 'Withdrawal Fees', sub: 'Dynamic fee settings' },
  { id: 'ads', icon: '📺', label: 'Ads', title: 'Ads Management', sub: 'Adsgram integration' },
  { id: 'anticheat', icon: '🛡️', label: 'Anti-Cheat', title: 'Anti-Cheat Alerts', sub: 'Duplicate detection' },
  { id: 'payouts', icon: '🚀', label: 'Payouts', title: 'Batch Payouts', sub: 'Highload V2 (255/TX)' },
];

function getInitData() {
  return tg?.initData || new URLSearchParams(location.search).get('initData') || '';
}

async function api(path, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  const initData = getInitData();
  if (initData) headers['X-Telegram-Init-Data'] = initData;
  if (ADMIN_SECRET) headers['X-Admin-Secret'] = ADMIN_SECRET;
  
  try {
    const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null });
    if (res.status === 401) {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('admin-app').classList.add('hidden');
      ADMIN_SECRET = '';
    }
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'network' };
  }
}

async function checkPassword() {
  const pass = document.getElementById('admin-pass').value.trim();
  const errEl = document.getElementById('login-error');
  
  if (!pass) return;
  errEl.textContent = 'Checking...';
  
  try {
    const res = await fetch('/api/admin/stats', {
      headers: {
        'Content-Type': 'application/json',
        'X-Telegram-Init-Data': getInitData(),
        'X-Admin-Secret': pass
      }
    });
    
    if (res.ok) {
      ADMIN_SECRET = pass;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('admin-app').classList.remove('hidden');
      errEl.textContent = '';
      initAdmin();
    } else if (res.status === 403) {
      errEl.textContent = '❌ You are not an admin';
    } else {
      errEl.textContent = '❌ Wrong password';
    }
  } catch (e) {
    errEl.textContent = '❌ Connection error';
  }
}

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = 'toast', 2500);
}

function renderNav() {
  const sidebar = document.getElementById('sidebarNav');
  sidebar.innerHTML = NAV.map(n => {
    let badge = '';
    if (n.id === 'withdrawals' && STATE.stats.wdPending > 0) {
      badge = `<span class="badge">${STATE.stats.wdPending}</span>`;
    } else if (n.id === 'anticheat' && STATE.stats.openAlerts > 0) {
      badge = `<span class="badge">${STATE.stats.openAlerts}</span>`;
    }
    return `<button class="nav-btn ${STATE.tab === n.id ? 'active' : ''}" onclick="switchTab('${n.id}')">
      <span>${n.icon}</span><span>${n.label}</span>${badge}
    </button>`;
  }).join('');

  const mob = document.getElementById('mobTabs');
  mob.innerHTML = NAV.map(n =>
    `<button class="mob-tab ${STATE.tab === n.id ? 'active' : ''}" onclick="switchTab('${n.id}')">${n.icon} ${n.label}</button>`
  ).join('');
}

function switchTab(tab) {
  STATE.tab = tab;
  renderNav();
  const nav = NAV.find(n => n.id === tab);
  document.getElementById('pageTitle').textContent = nav.title;
  document.getElementById('pageSub').textContent = nav.sub;
  loadTab();
}

async function loadTab() {
  STATE.loading = true;
  renderContent();

  try {
    switch (STATE.tab) {
      case 'dashboard': await loadStats(); await loadEconomy(); break;
      case 'users': await loadHold(); await loadUsers(); break;
      case 'mining': await loadEconomy(); break;
      case 'tasks': await loadTasksAdmin(); break;
      case 'withdrawals': await loadWithdrawals(); break;
      case 'fees': await loadFeeConfig(); break;
      case 'ads': await loadEconomy(); break;
      case 'anticheat': await loadAlerts(); break;
      case 'payouts': await loadPayoutStats(); break;
    }
  } catch (e) {
    console.error(e);
  }

  STATE.loading = false;
  renderContent();
}

function renderContent() {
  const el = document.getElementById('content');
  if (STATE.loading) {
    el.innerHTML = '<div class="empty"><span class="spin">⏳</span> Loading...</div>';
    return;
  }
  switch (STATE.tab) {
    case 'dashboard': renderDashboard(el); break;
    case 'users': renderUsers(el); break;
    case 'mining': renderMining(el); break;
    case 'tasks': renderTasks(el); break;
    case 'withdrawals': renderWithdrawals(el); break;
    case 'fees': renderFees(el); break;
    case 'ads': renderAds(el); break;
    case 'anticheat': renderAlerts(el); break;
    case 'payouts': renderPayouts(el); break;
  }
}

// ========== DASHBOARD ==========
async function loadStats() {
  const res = await api('/api/admin/stats');
  if (res.ok) STATE.stats = { ...STATE.stats, ...res };
}

function renderDashboard(el) {
  el.innerHTML = `
    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-label">Total Users</div>
        <div class="stat-value">${STATE.stats.usersCount}</div>
        <div class="stat-sub">Registered accounts</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Withdrawals</div>
        <div class="stat-value" style="color:var(--warn);">${STATE.stats.wdPending}</div>
        <div class="stat-sub">Need review</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Balance</div>
        <div class="stat-value">${(STATE.stats.totalBalance || 0).toFixed(0)}</div>
        <div class="stat-sub">FWC in circulation</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Mined</div>
        <div class="stat-value">${(STATE.stats.totalMined || 0).toFixed(0)}</div>
        <div class="stat-sub">FWC all-time</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Fees</div>
        <div class="stat-value" style="color:var(--accent-2);">${(STATE.stats.totalFees || 0).toFixed(2)}</div>
        <div class="stat-sub">FWC collected</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Open Alerts</div>
        <div class="stat-value" style="color:${STATE.stats.openAlerts > 0 ? 'var(--danger)' : 'var(--accent-2)'};">${STATE.stats.openAlerts || 0}</div>
        <div class="stat-sub">Anti-cheat warnings</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">⚙️ Current Settings</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;font-size:12px;">
        <div><span style="color:var(--text-muted);">Mining reward:</span> <b>${STATE.stats.miningAmount} FWC</b></div>
        <div><span style="color:var(--text-muted);">Min withdraw:</span> <b>${STATE.economy.withdraw_min || 1000} FWC</b></div>
        <div><span style="color:var(--text-muted);">Withdraw delay:</span> <b>${STATE.economy.withdraw_delay_hours || 24}h</b></div>
        <div><span style="color:var(--text-muted);">Fee:</span> <b>${STATE.economy.withdraw_fee_percent || 5}%</b></div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">⚡ Quick Actions</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" onclick="switchTab('withdrawals')">💸 Withdrawals (${STATE.stats.wdPending})</button>
        <button class="btn" onclick="switchTab('fees')">💰 Fees</button>
        <button class="btn" onclick="switchTab('ads')">📺 Ads</button>
        <button class="btn" onclick="switchTab('anticheat')">🛡️ Alerts (${STATE.stats.openAlerts})</button>
        <button class="btn" onclick="switchTab('payouts')">🚀 Payouts</button>
      </div>
    </div>
  `;
}

// ========== USERS ==========
async function loadUsers(search = '') {
  const res = await api('/api/admin/users?limit=200' + (search ? '&q=' + encodeURIComponent(search) : ''));
  if (res.ok) STATE.users = res.users;
}

function renderUsers(el) {
  el.innerHTML = `
    <div class="section">

function openBalanceModal(tgId = null) {
  document.getElementById('balanceModal').style.display = 'flex';
  if(tgId) document.getElementById('bal_tg_id').value = tgId;
}
function closeBalanceModal() {
  document.getElementById('balanceModal').style.display = 'none';
}
async function quickAddBalance(tgId, amount) {
  if(!confirm(`Add ${amount} FWC to ${tgId}?`)) return;
  const res = await api(`/api/admin/users/${tgId}/balance`, 'POST', { amount, mode: 'add' });
  if(res.ok) {
    toast(`+${amount} FWC added ✅`, 'success');
    await loadUsers();
    renderContent();
  } else toast('Error: ' + (res.error||''), 'error');
}
async function submitBalance() {
  const tgId = parseInt(document.getElementById('bal_tg_id').value);
  const amount = parseFloat(document.getElementById('bal_amount').value);
  const mode = document.getElementById('bal_mode').value;
  if(!tgId || isNaN(amount)) { document.getElementById('bal_result').textContent = 'Invalid input'; return; }
  const res = await api(`/api/admin/users/${tgId}/balance`, 'POST', { amount, mode });
  if(res.ok) {
    document.getElementById('bal_result').textContent = `Success! New balance: ${res.newBalance?.toFixed(2) || ''}`;
    toast('Balance updated ✅', 'success');
    await loadUsers();
    setTimeout(()=>{ closeBalanceModal(); renderContent(); }, 800);
  } else {
    document.getElementById('bal_result').textContent = 'Error: ' + (res.error||'');
  }
}
async function resetWithdrawals(tgId) {
  if(!confirm(`Delete ALL withdrawals for ${tgId}? This resets Hold test to first withdraw.`)) return;
  const res = await api(`/api/admin/users/${tgId}/withdrawals/reset`, 'POST');
  if(res.ok) {
    toast(`Withdrawals reset (${res.deleted} deleted) ✅`, 'success');
  } else toast('Error: ' + (res.error||''), 'error');
}


let searchTimeout = null;
function debounceSearch(q) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(async () => {
    await loadUsers(q);
    renderContent();
  }, 400);
}

async function toggleBan(id, isBanned) {
  const action = isBanned ? 'unban' : 'ban';
  const res = await api(`/api/admin/users/${id}/${action}`, 'POST');
  if (res.ok) {
    toast(isBanned ? 'Unbanned ✅' : 'Banned 🚫', 'success');
    await loadUsers();
    renderContent();
  } else {
    toast('Error', 'error');
  }
}

function toggleChannelField() {
  const type = document.getElementById('task-type').value;
  document.getElementById('channel-field').style.display = type === 'join' ? 'block' : 'none';
  document.getElementById('url-field').style.display = type === 'ads' ? 'none' : 'block';
  document.getElementById('ads-info-field').style.display = type === 'ads' ? 'block' : 'none';
}

function openTaskModal(task = null) {
  EDITING_TASK_ID = task ? task.id : null;
  document.getElementById('task-modal-title').textContent = task ? 'Edit Task' : 'Add New Task';
  
  document.getElementById('task-id').value = task ? task.id : '';
  document.getElementById('task-id').disabled = !!task;
  
  document.getElementById('task-title').value = task ? task.title : '';
  document.getElementById('task-title-ar').value = task ? (task.title_ar || '') : '';
  document.getElementById('task-type').value = task ? task.type : 'join';
  document.getElementById('task-reward').value = task ? task.reward : 5;
  document.getElementById('task-url').value = task ? (task.url || '') : '';
  document.getElementById('task-channel').value = task ? (task.channel || '') : '';
  document.getElementById('task-max').value = task ? (task.max_per_day || 1) : 1;
  document.getElementById('task-once').value = task ? (task.once ? '1' : '0') : '0';

  toggleChannelField();
  document.getElementById('task-modal').classList.remove('hidden');
}

function closeTaskModal() {
  document.getElementById('task-modal').classList.add('hidden');
  EDITING_TASK_ID = null;
}

async function saveTaskData() {
  const id = document.getElementById('task-id').value.trim();
  const title = document.getElementById('task-title').value.trim();
  const title_ar = document.getElementById('task-title-ar').value.trim();
  const type = document.getElementById('task-type').value;
  const reward = parseFloat(document.getElementById('task-reward').value) || 0;
  const url = document.getElementById('task-url').value.trim() || null;
  const channel = document.getElementById('task-channel').value.trim() || null;
  const max_per_day = parseInt(document.getElementById('task-max').value) || 1;
  const once = document.getElementById('task-once').value === '1';

  if (!id || !title) return toast('ID and Title are required', 'error');

  const payload = { id, title, title_ar, type, reward, url, channel, max_per_day, once, active: true };

  let res;
  if (EDITING_TASK_ID) {
    res = await api('/api/admin/tasks/' + EDITING_TASK_ID, 'PUT', payload);
  } else {
    res = await api('/api/admin/tasks', 'POST', payload);
  }

  if (res.ok) {
    toast(EDITING_TASK_ID ? 'Task updated ✅' : 'Task added ✅', 'success');
    closeTaskModal();
    await loadTasksAdmin();
    renderContent();
  } else {
    toast('Error: ' + (res.error || ''), 'error');
  }
}

function editTask(id) {
  const task = STATE.tasks.find(t => t.id === id);
  if (task) openTaskModal(task);
}

async function toggleTaskActive(id, current) {
  const res = await api('/api/admin/tasks/' + id, 'PUT', { active: !current });
  if (res.ok) {
    toast('Updated ✅', 'success');
    await loadTasksAdmin();
    renderContent();
  }
}

async function deleteTaskItem(id) {
  if (!confirm('Delete task ' + id + '?')) return;
  const res = await api('/api/admin/tasks/' + id, 'DELETE');
  if (res.ok) {
    toast('Deleted', 'success');
    await loadTasksAdmin();
    renderContent();
  }
}

  } catch (e) {
    prompt('Copy the wallet manually:', wallet);

              <option value="0" ${!autoOnTasks ? 'selected' : ''}>No</option>
            </select>
          </div>
        </div>
      </div>

      <div style="margin-top:16px;padding:12px;border-radius:10px;background:rgba(122,255,198,0.08);border:1px solid rgba(122,255,198,0.2);">
        <div style="font-weight:700;font-size:12px;margin-bottom:8px;color:var(--accent-2);">🎁 Reward Ads (Free Boost)</div>
        <div class="form-row">
          <div class="form-group">
            <label>Reward Ads Block ID</label>
            <input type="text" id="ad_free_block_id" value="${eco.ad_free_block_id || ''}" placeholder="int-yyyyy">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Multiplier (x)</label>
            <input type="number" step="0.1" min="1" id="ad_free_mult" value="${eco.ad_free_mult || 2}">
          </div>
          <div class="form-group">
            <label>Duration (seconds)</label>
            <input type="number" min="0" id="ad_free_duration_sec" value="${eco.ad_free_duration_sec || 7200}">
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">
          Example: x2 for 7200s (2 hours) — user watches ad, gets 2x mining boost for 2 hours.
        </div>
      </div>

      <div style="margin-top:16px;display:flex;gap:8px;">
        <button class="btn btn-primary" style="flex:1;" onclick="saveAdsConfig()">💾 Save Ads Config</button>
      </div>
    </div>
  `;
}

async function saveAdsConfig() {
  const updates = {
    ad_enabled: document.getElementById('ad_enabled').value,
    ad_auto_enabled: document.getElementById('ad_auto_enabled').value,
    ad_auto_block_id: document.getElementById('ad_auto_block_id').value,
    ad_auto_on_mine: document.getElementById('ad_auto_on_mine').value,
    ad_auto_on_tasks: document.getElementById('ad_auto_on_tasks').value,
    ad_free_block_id: document.getElementById('ad_free_block_id').value,
    ad_free_mult: document.getElementById('ad_free_mult').value,
    ad_free_duration_sec: document.getElementById('ad_free_duration_sec').value,
  };

  for (const [key, value] of Object.entries(updates)) {
    await api('/api/admin/economy', 'POST', { key, value });
  }

  toast('Ads config saved ✅', 'success');
  await loadEconomy();
  renderContent();
}

// ========== ANTI-CHEAT ==========
async function loadAlerts() {
  const res = await api('/api/admin/anticheat?status=open');
  if (res.ok) STATE.alerts = res.alerts;
}

function renderAlerts(el) {
  el.innerHTML = `
    <div class="section">
      <div class="section-title">
        <span>🛡️ Open Alerts (${STATE.alerts.length})</span>
        <button class="btn btn-sm" onclick="loadTab()">🔄</button>
      </div>
      ${STATE.alerts.length === 0 ? '<div class="empty">No alerts ✅</div>' :
        STATE.alerts.map(a => `
          <div style="padding:12px;border-radius:10px;background:rgba(255,77,77,0.08);border:1px solid rgba(255,77,77,0.2);margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <div style="font-weight:700;color:#ff6b6b;font-size:12px;">${a.type.replace('_', ' ').toUpperCase()}</div>
              <div style="font-size:10px;color:var(--text-muted);">${new Date(a.created_at * 1000).toLocaleString()}</div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">${a.details}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px;">Users: ${a.telegram_ids}</div>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-sm btn-primary" onclick="resolveAlert(${a.id})">✅ Resolve</button>
              <button class="btn btn-sm" onclick="dismissAlert(${a.id})">🚫 Dismiss</button>
            </div>
          </div>
        `).join('')}
    </div>
  `;
}

async function resolveAlert(id) {
  const res = await api(`/api/admin/anticheat/${id}/resolve`, 'POST');
  if (res.ok) {
    toast('Resolved', 'success');
    await loadAlerts();
    await loadStats();
    renderContent();
  }
}

async function dismissAlert(id) {
  const res = await api(`/api/admin/anticheat/${id}/dismiss`, 'POST');
  if (res.ok) {
    toast('Dismissed', 'success');
    await loadAlerts();
    await loadStats();
    renderContent();
  }
}

// ========== PAYOUTS ==========
async function loadPayoutStats() {
  const res = await api('/api/admin/payouts/stats');
  if (res.ok) STATE.payoutStats = res.stats;
}

function renderPayouts(el) {
  const s = STATE.payoutStats || {};
  el.innerHTML = `
    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value">${s.pendingCount || 0}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total FWC</div>
        <div class="stat-value">${(s.pendingTotal || 0).toFixed(0)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Batches Needed</div>
        <div class="stat-value">${s.batchesNeeded || 0}</div>
      </div>
      ${s.gasSaving ? `
        <div class="stat-card">
          <div class="stat-label">Gas Saved</div>
          <div class="stat-value" style="color:var(--accent-2);">${s.gasSaving.saved} TON</div>
          <div class="stat-sub">${s.gasSaving.savedPercent}% saved</div>
        </div>
      ` : ''}
    </div>
    <div class="section">
      <div class="section-title">🚀 Execute Batch (max 255)</div>
      <button class="btn btn-primary" onclick="executePayout()">⚡ Execute Next Batch</button>
    </div>
  `;
}

async function executePayout() {
  if (!confirm('Execute batch payout (max 255 withdrawals)?')) return;
  const res = await api('/api/admin/payouts/execute', 'POST', { limit: 255 });
  if (res.ok) {
    toast(`✅ ${res.marked} processed. TX: ${(res.txHash || '').slice(0, 12)}...`, 'success');
    await loadPayoutStats();
    await loadStats();
    renderContent();
  } else {
    toast('Error: ' + (res.error || ''), 'error');
  }
}

// ========== REFRESH ==========
async function refreshPage() {
  await loadTab();
  toast('Refreshed 🔄', 'success');
}

  switchTab('dashboard');
}
