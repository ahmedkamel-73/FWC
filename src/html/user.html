<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FWC Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<style>
  :root {
    --bg: #080C18;
    --surface: #0F1522;
    --surface-2: #161d2e;
    --border: rgba(255,255,255,0.08);
    --text: #EAF0FF;
    --text-muted: #7a8599;
    --accent: #6D7CFF;
    --accent-2: #00E5FF;
    --success: #00E5FF;
    --danger: #ff4d4d;
    --warn: #ffb020;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-x: hidden; padding-bottom: 90px; }
  .container { max-width: 500px; margin: 0 auto; }
  .header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(8,12,24,0.94); backdrop-filter: blur(16px); z-index: 20; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #6D7CFF, #00E5FF); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #fff; }
  .logo-title { font-weight: 700; font-size: 14px; }
  .logo-sub { font-size: 10px; color: var(--text-muted); font-family: var(--mono); }
  .lang-btn { padding: 6px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 11px; cursor: pointer; }
  .balance-row { display: flex; gap: 10px; padding: 12px 16px; }
  .card { background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
  .balance-card { flex: 1; }
  .label-small { font-size: 10px; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .balance-value { font-size: 22px; font-weight: 800; display: flex; align-items: baseline; gap: 6px; }
  .currency { font-size: 12px; color: var(--accent); font-weight: 700; }
  .speed-card { width: 100px; }
  .speed-value { font-size: 15px; font-weight: 800; }
  .content { padding: 12px 16px; }
  .mining-card { border-radius: 24px; padding: 20px 16px; background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
  .mining-circle { width: 180px; height: 180px; margin: 20px auto; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #A8B2FF 8%, #6D7CFF 22%, #3A4DE8 45%, #0A1230 78%); box-shadow: 0 0 40px rgba(109,124,255,0.6), 0 0 100px rgba(109,124,255,0.25), inset 0 0 20px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #fff; position: relative; }
  .mining-circle::after { content: ''; position: absolute; inset: -30px; border-radius: 50%; border: 2px dashed rgba(0,229,255,0.25); animation: spin 20s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .claim-btn { margin-top: 20px; width: 100%; height: 58px; border-radius: 16px; border: none; background: linear-gradient(180deg, #7D8CFF 0%, #5A6AE8 100%); color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 0 #2A3560, 0 12px 24px rgba(0,0,0,0.4); transition: transform 0.12s; font-family: inherit; }
  .claim-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 4px 0 #2A3560; }
  .claim-btn:disabled { opacity: 0.5; background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06)); box-shadow: 0 8px 0 #1A233F; cursor: not-allowed; }
  .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; padding: 8px 10px; background: linear-gradient(180deg, rgba(18,24,42,0.95), rgba(10,14,28,0.98)); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; z-index: 30; }
  .tab-btn { flex: 1; height: 56px; border-radius: 14px; border: none; background: transparent; color: rgba(255,255,255,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .tab-btn.active { background: linear-gradient(180deg, #7D8CFF, #5A6AE8); color: #fff; box-shadow: 0 8px 20px rgba(109,124,255,0.35); }
  .tab-btn .icon { font-size: 18px; }
  .tab-btn .label { font-size: 10px; font-weight: 600; }
  .tasks-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .task-item { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .task-item.done { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.2); opacity: 0.65; }
  .task-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .task-icon { font-size: 20px; flex-shrink: 0; }
  .task-name { font-size: 13px; font-weight: 600; }
  .task-reward { font-size: 11px; color: var(--accent-2); font-family: var(--mono); margin-top: 3px; }
  .task-btn { height: 32px; padding: 0 14px; border-radius: 10px; border: none; background: linear-gradient(180deg, #7D8CFF, #5A6AE8); color: #fff; font-weight: 700; font-size: 11px; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  .task-btn:disabled { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); cursor: default; }
  .wallet-card { padding: 18px; border-radius: 20px; background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid var(--border); }
  .wallet-input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: var(--text); padding: 0 14px; font-size: 13px; font-family: var(--mono); margin-top: 8px; }
  .wallet-input:focus { outline: none; border-color: var(--accent); }
  .btn-primary { width: 100%; height: 44px; border-radius: 12px; border: none; background: linear-gradient(180deg, #7D8CFF, #5A6AE8); color: #fff; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; margin-top: 12px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .leader-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
  .leader-item.you { background: linear-gradient(135deg, rgba(109,124,255,0.18), rgba(0,229,255,0.08)); border-color: rgba(109,124,255,0.3); }
  .rank { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
  .rank.top { background: linear-gradient(135deg, #FFD54F, #FF8F00); color: #000; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(18,24,42,0.95); border: 1px solid var(--border); padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 100; backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 85%; text-align: center; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .fee-preview { margin-top: 10px; padding: 12px; border-radius: 12px; background: rgba(109,124,255,0.08); border: 1px solid rgba(109,124,255,0.2); font-size: 12px; }
  .fee-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .fee-row:last-child { margin-bottom: 0; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  #ton-connect-btn { width: 100%; margin-top: 10px; }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">FWC</div>
      <div>
        <div class="logo-title">FWC MINING</div>
        <div class="logo-sub">LIVE • SECURE</div>
      </div>
    </div>
    <button class="lang-btn" onclick="cycleLanguage()" id="langBtn">EN</button>
  </header>

  <div class="balance-row">
    <div class="card balance-card">
      <div class="label-small" data-i18n="balance">BALANCE</div>
      <div class="balance-value">
        <span id="balanceNum">—</span>
        <span class="currency">FWC</span>
      </div>
    </div>
    <div class="card speed-card">
      <div class="label-small" data-i18n="speed">SPEED</div>
      <div class="speed-value"><span id="speedVal">—</span></div>
    </div>
  </div>

  <div class="content">
    <!-- TAB: MINE -->
    <div id="tab-mine">
      <div class="mining-card">
        <div class="mining-circle">FWC</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-top:10px;" id="miningStatus">Loading...</div>
        <button class="claim-btn" id="claimBtn" disabled>
          <span>⚡</span> <span id="claimText">Loading</span>
        </button>
      </div>
      <div class="card" style="margin-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div class="label-small" data-i18n="checkin">DAILY CHECK-IN</div>
            <div style="font-size:14px;font-weight:700;margin-top:4px;">
              <span data-i18n="streak">Streak</span>: <span id="streakNum">0</span>
            </div>
          </div>
          <button class="task-btn" id="checkinBtn" onclick="doCheckin()" data-i18n="checkin">Check-in</button>
        </div>
      </div>
    </div>

    <!-- TAB: TASKS -->
    <div id="tab-tasks" class="hidden">
      <h2 style="font-size:16px;font-weight:800;margin-bottom:12px;">📋 <span data-i18n="tasks">Tasks</span></h2>
      <div class="tasks-list" id="tasksList">
        <div style="text-align:center;color:var(--text-muted);padding:20px;"><span class="spinner"></span></div>
      </div>
    </div>

    <!-- TAB: WALLET -->
    <div id="tab-wallet" class="hidden">
      <h2 style="font-size:16px;font-weight:800;margin-bottom:12px;">💳 <span data-i18n="wallet">Wallet</span></h2>
      <div class="wallet-card">
        <div class="label-small" data-i18n="tonWallet">TON WALLET</div>
        <!-- الزرار الفعلي لـ TonConnect -->
        <button id="ton-connect-btn" class="btn-primary">Connect Wallet</button>
        <div id="walletAddress" style="font-size:11px;color:var(--text-muted);margin-top:8px;word-break:break-all;"></div>

        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <div class="label-small" data-i18n="withdraw">WITHDRAW</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;" id="withdrawInfo">Min: 1000 FWC</div>
          <input class="wallet-input" id="withdrawInput" type="number" placeholder="Amount" oninput="estimateWithdraw()" />
          <div class="fee-preview hidden" id="feePreview">
            <div class="fee-row">
              <span style="color:var(--text-muted);" data-i18n="amount">Amount:</span>
              <span id="feeAmount" style="font-weight:700;">0 FWC</span>
            </div>
            <div class="fee-row">
              <span style="color:var(--text-muted);"><span data-i18n="fee">Fee</span> (<span id="feePercent">5</span>%):</span>
              <span id="feeValue" style="font-weight:700;color:var(--warn);">0 FWC</span>
            </div>
            <div class="fee-row">
              <span style="color:var(--text-muted);" data-i18n="youReceive">You receive:</span>
              <span id="feeNet" style="font-weight:800;color:var(--accent-2);">0 FWC</span>
            </div>
          </div>
          <button class="btn-primary" id="withdrawBtn" onclick="requestWithdraw()" data-i18n="requestWithdraw">Request Withdrawal</button>
        </div>
      </div>
      <div class="card" style="margin-top:12px;">
        <div class="label-small" data-i18n="recentWithdrawals">RECENT WITHDRAWALS</div>
        <div id="withdrawHistory" style="margin-top:8px;font-size:12px;color:var(--text-muted);">No withdrawals</div>
      </div>
    </div>

    <!-- TAB: MARKET -->
    <div id="tab-market" class="hidden">
      <h2 style="font-size:16px;font-weight:800;margin-bottom:12px;">🏆 <span data-i18n="leaderboard">Leaderboard</span></h2>
      <div id="leaderboard">
        <div style="text-align:center;color:var(--text-muted);padding:20px;"><span class="spinner"></span></div>
      </div>
    </div>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="mine" onclick="switchTab('mine')">
      <span class="icon">⛏️</span><span class="label" data-i18n="mine">Mine</span>
    </button>
    <button class="tab-btn" data-tab="tasks" onclick="switchTab('tasks')">
      <span class="icon">📋</span><span class="label" data-i18n="tasks">Tasks</span>
    </button>
    <button class="tab-btn" data-tab="wallet" onclick="switchTab('wallet')">
      <span class="icon">💳</span><span class="label" data-i18n="wallet">Wallet</span>
    </button>
    <button class="tab-btn" data-tab="market" onclick="switchTab('market')">
      <span class="icon">🏆</span><span class="label" data-i18n="leaderboard">Top</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== GLOBALS ==========
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const TRANSLATIONS = {
  en: { balance:'Balance', speed:'Speed', mine:'Mine', tasks:'Tasks', wallet:'Wallet', leaderboard:'Leaderboard', checkin:'Check-in', streak:'Streak', tonWallet:'TON WALLET', saveWallet:'Save Wallet', withdraw:'WITHDRAW', amount:'Amount', fee:'Fee', youReceive:'You receive', requestWithdraw:'Request Withdrawal', recentWithdrawals:'RECENT WITHDRAWALS', claim:'CLAIM', ready:'Ready to mine', wait:'Please wait', addWallet:'Connect Wallet', banned:'Banned', cooldown:'Cooldown' },
  ar: { balance:'الرصيد', speed:'السرعة', mine:'تعدين', tasks:'مهام', wallet:'محفظة', leaderboard:'المتصدرين', checkin:'تسجيل يومي', streak:'سلسلة', tonWallet:'محفظة TON', saveWallet:'حفظ', withdraw:'سحب', amount:'المبلغ', fee:'الرسوم', youReceive:'ستستلم', requestWithdraw:'طلب سحب', recentWithdrawals:'آخر السحوبات', claim:'استلام', ready:'جاهز للتعدين', wait:'انتظر', addWallet:'اربط المحفظة', banned:'محظور', cooldown:'قيد الانتظار' },
  ru: { balance:'Баланс', speed:'Скорость', mine:'Майнинг', tasks:'Задачи', wallet:'Кошелек', leaderboard:'Топ', checkin:'Регистрация', streak:'Серия', tonWallet:'TON КОШЕЛЕК', saveWallet:'Сохранить', withdraw:'Вывод', amount:'Сумма', fee:'Комиссия', youReceive:'Вы получите', requestWithdraw:'Запросить вывод', recentWithdrawals:'ПОСЛЕДНИЕ ВЫВОДЫ', claim:'ЗАБРАТЬ', ready:'Готов к майнингу', wait:'Подождите', addWallet:'Подключить', banned:'Забанен', cooldown:'Ожидание' },
  tr: { balance:'Bakiye', speed:'Hız', mine:'Madencilik', tasks:'Görevler', wallet:'Cüzdan', leaderboard:'Liderlik', checkin:'Giriş', streak:'Seri', tonWallet:'TON CÜZDAN', saveWallet:'Kaydet', withdraw:'Çek', amount:'Miktar', fee:'Ücret', youReceive:'Alacaksınız', requestWithdraw:'Çekim Talep Et', recentWithdrawals:'SON ÇEKİMLER', claim:'AL', ready:'Kazımaya hazır', wait:'Bekleyin', addWallet:'Cüzdan Bağla', banned:'Yasaklı', cooldown:'Beklemede' },
};

const STATE = {
  telegram_id: null, language: 'en', balance: 0, wallet: null, is_banned: 0,
  miningAmount: 0, canMine: { ok: false, reason: 'loading' }, canWithdraw: { ok: false },
  streak: 0, tasks: [], progress: [], activeTab: 'mine', cooldownTimer: null,
  refreshTimer: null, lastFeeEstimate: null,
};

let tonConnectUI = null;

function getInitData() { return tg?.initData || new URLSearchParams(location.search).get('initData') || ''; }

async function api(path, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  const initData = getInitData();
  if (initData) headers['X-Telegram-Init-Data'] = initData;
  try { const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : null }); return await res.json(); } catch (e) { return { ok: false, error: 'network' }; }
}

function t(key) { return TRANSLATIONS[STATE.language]?.[key] || TRANSLATIONS.en[key] || key; }
function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.getAttribute('data-i18n'); if (el.tagName === 'INPUT') el.placeholder = t(key); else el.textContent = t(key); });
  document.getElementById('langBtn').textContent = STATE.language.toUpperCase();
  document.documentElement.dir = STATE.language === 'ar' ? 'rtl' : 'ltr';
}
function cycleLanguage() { const langs = ['en', 'ar', 'ru', 'tr']; const idx = langs.indexOf(STATE.language); const next = langs[(idx + 1) % langs.length]; STATE.language = next; applyTranslations(); api('/api/language', 'POST', { lang: next }).catch(() => {}); }

function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'error' ? 'rgba(255,77,77,0.95)' : type === 'success' ? 'rgba(0,229,255,0.95)' : 'rgba(18,24,42,0.95)';
  el.style.color = type === 'success' ? '#080C18' : '#EAF0FF';
  el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ========== TON CONNECT INIT ==========
function initTonConnect() {
  tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl: window.location.origin + '/tonconnect-manifest.json',
    buttonRootId: 'ton-connect-btn',
    tonProof: {
      payload: 'FWC-VERIFY-' + Math.random().toString(36).substring(2, 15) + Date.now()
    }
  });

  tonConnectUI.onStatusChange(async (wallet) => {
    if (wallet) {
      document.getElementById('walletAddress').textContent = wallet.account.address;
      if (wallet.connectItems?.tonProof && 'proof' in wallet.connectItems.tonProof) {
        const proof = wallet.connectItems.tonProof.proof;
        const res = await api('/api/wallet/verify', 'POST', {
          address: wallet.account.address,
          publicKey: wallet.account.publicKey,
          proof: {
            timestamp: proof.timestamp,
            domain: proof.domain,
            signature: proof.signature,
            payload: proof.payload,
            state_init: proof.stateInit
          },
          account: {
            address: wallet.account.address,
            publicKey: wallet.account.publicKey,
            chain: wallet.account.chain
          }
        });
        if (res.ok) {
          STATE.wallet = res.wallet;
          toast('Wallet verified ✅', 'success');
          await loadUser();
        } else {
          toast('Verification failed: ' + (res.error || ''), 'error');
        }
      } else {
        toast('Please sign the message to verify wallet ownership', 'error');
      }
    } else {
      document.getElementById('walletAddress').textContent = '';
    }
  });
}

// ========== LOAD USER ==========
async function loadUser() {
  const res = await api('/api/me');
  if (!res.ok) { if (res.error === 'forbidden') return toast('Open from Telegram', 'error'); return toast('Error loading', 'error'); }
  STATE.telegram_id = res.telegram_id; STATE.language = res.language || 'en'; STATE.balance = res.balance;
  STATE.wallet = res.wallet; STATE.is_banned = res.is_banned; STATE.miningAmount = res.miningAmount;
  STATE.canMine = res.canMine; STATE.canWithdraw = res.canWithdraw; STATE.streak = res.streak || 0;
  applyTranslations(); renderMine(); renderWallet();
}

function renderMine() {
  document.getElementById('balanceNum').textContent = STATE.balance.toFixed(4);
  document.getElementById('speedVal').textContent = STATE.miningAmount.toFixed(2);
  document.getElementById('streakNum').textContent = STATE.streak;
  const statusEl = document.getElementById('miningStatus');
  const btn = document.getElementById('claimBtn');
  const btnText = document.getElementById('claimText');
  if (STATE.is_banned) { statusEl.textContent = '⛔ ' + t('banned'); btn.disabled = true; btnText.textContent = t('banned'); return; }
  if (!STATE.wallet) { statusEl.textContent = '⚠️ ' + t('addWallet'); btn.disabled = true; btnText.textContent = t('addWallet'); btn.onclick = () => switchTab('wallet'); return; }
  if (STATE.canMine.ok) { statusEl.textContent = '✅ ' + t('ready'); btn.disabled = false; btnText.textContent = `${t('claim')} ${STATE.miningAmount.toFixed(2)} FWC`; btn.onclick = doMine; }
  else if (STATE.canMine.reason === 'cooldown') { btn.disabled = true; btn.onclick = null; startCooldown(STATE.canMine.remaining); }
  else { statusEl.textContent = '⏳ ' + (STATE.canMine.reason || t('wait')); btn.disabled = true; btnText.textContent = t('wait'); }
}

function startCooldown(remainingMs) {
  const statusEl = document.getElementById('miningStatus'); const btn = document.getElementById('claimBtn'); const btnText = document.getElementById('claimText');
  btn.disabled = true; clearInterval(STATE.cooldownTimer); let ms = remainingMs;
  const tick = () => { if (ms <= 0) { clearInterval(STATE.cooldownTimer); loadUser(); return; } const h = Math.floor(ms / 3600000); const m = Math.floor((ms % 3600000) / 60000); const s = Math.floor((ms % 60000) / 1000); statusEl.textContent = `⏳ ${h}h ${m}m ${s}s`; btnText.textContent = t('cooldown'); ms -= 1000; };
  tick(); STATE.cooldownTimer = setInterval(tick, 1000);
}

async function doMine() { const btn = document.getElementById('claimBtn'); btn.disabled = true; const res = await api('/api/mine', 'POST'); if (res.ok) { STATE.balance = res.newBalance; toast(`+${res.amount} FWC ✅`, 'success'); if (tg) tg.HapticFeedback?.notificationOccurred('success'); await loadUser(); } else { toast('Error: ' + (res.error || ''), 'error'); await loadUser(); } }

async function doCheckin() { const res = await api('/api/checkin', 'POST'); if (res.ok) { toast(`+${res.reward} FWC • Streak ${res.streak} 🔥`, 'success'); await loadUser(); } else if (res.error === 'already_checked_in') { toast('Already checked in today ✅'); } else { toast('Error: ' + res.error, 'error'); } }

async function loadTasks() { const res = await api('/api/tasks'); if (!res.ok) return; STATE.tasks = res.tasks; STATE.progress = res.progress; renderTasks(); }
function renderTasks() {
  const el = document.getElementById('tasksList');
  if (!STATE.tasks.length) { el.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">No tasks</div>'; return; }
  const icons = { checkin: '📅', ads: '📺', join: '🔗', youtube: '▶️', x: '𝕏', invite: '👥' };
  el.innerHTML = STATE.tasks.map(task => { const done = STATE.progress.includes(task.id); const icon = icons[task.type] || '📌'; const title = STATE.language === 'ar' && task.title_ar ? task.title_ar : task.title; return `<div class="task-item ${done ? 'done' : ''}"><div class="task-info"><div class="task-icon">${icon}</div><div><div class="task-name">${title}</div><div class="task-reward">+${task.reward} FWC</div></div></div>${done ? '<span style="color:var(--accent-2);font-size:11px;font-weight:700;">✓ Done</span>' : `<button class="task-btn" onclick="completeTask('${task.id}')">${task.type === 'checkin' ? t('checkin') : 'Start'}</button>`}</div>`; }).join('');
}
async function completeTask(id) { if (id === 'checkin') return doCheckin(); const res = await api('/api/tasks/' + id, 'POST'); if (res.ok) { toast(`+${res.reward} FWC ✅`, 'success'); await loadUser(); await loadTasks(); } else { toast('Error: ' + res.error, 'error'); } }

function renderWallet() {
  document.getElementById('walletAddress').textContent = STATE.wallet || '';
  const info = document.getElementById('withdrawInfo');
  if (STATE.canWithdraw?.ok) { info.textContent = `✅ ${t('ready')} (${STATE.balance.toFixed(2)} FWC)`; info.style.color = 'var(--accent-2)'; }
  else if (STATE.canWithdraw?.reason === 'min_balance') { info.textContent = `Min: ${STATE.canWithdraw.need} FWC (you have ${STATE.balance.toFixed(2)})`; info.style.color = 'var(--text-muted)'; }
  else if (STATE.canWithdraw?.reason === '24h') { info.textContent = `⏳ Wait ${STATE.canWithdraw.remaining.toFixed(1)}h`; info.style.color = 'var(--text-muted)'; }
  else if (STATE.canWithdraw?.reason === 'hold_required') { info.textContent = `⚠️ Hold ${STATE.canWithdraw.need} FWC in wallet (you have ${STATE.canWithdraw.current.toFixed(2)})`; info.style.color = 'var(--warn)'; }
  else if (!STATE.wallet) { info.textContent = t('addWallet'); }
}

let estimateTimeout = null;
function estimateWithdraw() {
  clearTimeout(estimateTimeout); estimateTimeout = setTimeout(async () => {
    const amount = parseFloat(document.getElementById('withdrawInput').value); const preview = document.getElementById('feePreview');
    if (!amount || amount <= 0) { preview.classList.add('hidden'); STATE.lastFeeEstimate = null; return; }
    const res = await api(`/api/withdraw/estimate?amount=${amount}`);
    if (!res.ok) { preview.classList.add('hidden'); STATE.lastFeeEstimate = null; return; }
    STATE.lastFeeEstimate = res; preview.classList.remove('hidden');
    document.getElementById('feeAmount').textContent = res.amount + ' FWC';
    document.getElementById('feePercent').textContent = res.percent;
    document.getElementById('feeValue').textContent = res.fee + ' FWC';
    document.getElementById('feeNet').textContent = res.netAmount + ' FWC';
  }, 400);
}

async function requestWithdraw() {
  const amount = parseFloat(document.getElementById('withdrawInput').value);
  if (!amount || amount <= 0) return toast('Enter valid amount', 'error');
  if (STATE.lastFeeEstimate) { const msg = `You will be charged ${STATE.lastFeeEstimate.fee} FWC fee.\nYou will receive: ${STATE.lastFeeEstimate.netAmount} FWC\n\nContinue?`; if (!confirm(msg)) return; }
  const btn = document.getElementById('withdrawBtn'); btn.disabled = true;
  const res = await api('/api/withdraw', 'POST', { amount }); btn.disabled = false;
  if (res.ok) { toast(`✅ Request sent\nYou'll receive ${res.amount} FWC`, 'success'); document.getElementById('withdrawInput').value = ''; document.getElementById('feePreview').classList.add('hidden'); STATE.lastFeeEstimate = null; await loadUser(); await loadWithdrawalHistory(); }
  else {
    const msgs = { min_balance: `Minimum ${STATE.canWithdraw?.need || 1000} FWC`, '24h': 'Wait 24h after first mine', no_wallet: 'Add your wallet first', pending_exists: 'You have a pending withdrawal', insufficient_balance: `Insufficient balance (need ${res.required || amount})`, hold_required: `You must hold ${STATE.canWithdraw?.need || 1000} FWC in your wallet to withdraw` };
    toast(msgs[res.error] || ('Error: ' + res.error), 'error');
  }
}

async function loadWithdrawalHistory() {
  const res = await api('/api/withdrawals'); if (!res.ok) return;
  const el = document.getElementById('withdrawHistory');
  if (!res.withdrawals.length) { el.textContent = 'No withdrawals'; return; }
  const statusMap = { pending: '⏳ Pending', approved: '✅ Approved', rejected: '❌ Rejected', processing: '🔄 Processing' };
  el.innerHTML = res.withdrawals.slice(0, 5).map(w => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><span>${w.net_amount || w.amount} FWC</span><span style="font-size:11px;">${statusMap[w.status] || w.status}</span></div>`).join('');
}

async function loadLeaderboard() {
  const res = await api('/api/leaderboard'); if (!res.ok) return;
  const el = document.getElementById('leaderboard');
  if (!res.leaders.length) { el.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">No data</div>'; return; }
  el.innerHTML = res.leaders.map((l, i) => { const isYou = l.telegram_id === STATE.telegram_id; return `<div class="leader-item ${isYou ? 'you' : ''}"><div style="display:flex;align-items:center;gap:10px;"><div class="rank ${i < 3 ? 'top' : ''}">${i + 1}</div><div style="font-size:13px;font-weight:${isYou ? 800 : 600};">${l.first_name || l.username || 'User'}${isYou ? ' (You)' : ''}</div></div><div style="font-size:12px;font-weight:700;">${l.balance.toFixed(2)} FWC</div></div>`; }).join('');
}

function switchTab(tab) {
  STATE.activeTab = tab;
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'tasks') loadTasks();
  if (tab === 'wallet') { renderWallet(); loadWithdrawalHistory(); }
  if (tab === 'market') loadLeaderboard();
}

async function init() {
  if (!getInitData()) { toast('Open from Telegram', 'error'); document.getElementById('miningStatus').textContent = '⚠️ Open from Telegram'; return; }
  await loadUser();
  initTonConnect(); // 👈 تشغيل TonConnect
  STATE.refreshTimer = setInterval(loadUser, 30000);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

window.switchTab = switchTab;
window.doCheckin = doCheckin;
window.requestWithdraw = requestWithdraw;
window.estimateWithdraw = estimateWithdraw;
window.completeTask = completeTask;
window.cycleLanguage = cycleLanguage;
</script>
</body>
</html>
